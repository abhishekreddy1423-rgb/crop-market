services:
  # ----------------------------------------------------
  # Backend Web Service (Flask REST API)
  # ----------------------------------------------------
  - type: web
    name: crop-market-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production

  # ----------------------------------------------------
  # Frontend Web Service (React Vite Static Site)
  # ----------------------------------------------------
  - type: static_site
    name: crop-market-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://crop-market-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
